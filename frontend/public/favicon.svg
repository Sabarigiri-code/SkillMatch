<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glossGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle with Brand Gradient -->
  <rect width="64" height="64" rx="16" fill="url(#brandGrad)" />
  <rect width="64" height="64" rx="16" fill="url(#glossGrad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#ffffff" stroke-opacity="0.2" fill="none" />

  <!-- Brain Circuit Icon (SkillMatch AI Motif) -->
  <g transform="translate(10, 10) scale(1.833)" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)">
    <!-- Brain Hemispheric Contours -->
    <path d="M12 4.6a3 3 0 0 0-5.8.5 3.8 3.8 0 0 0-2.4 5.5 3.8 3.8 0 0 0 .5 6.3 3.8 3.8 0 0 0 7.7.7" />
    <path d="M9 12.5a4 4 0 0 0 3-3.5" />
    <path d="M6.1 5.2a2.8 2.8 0 0 0 .4 1.3" />
    <path d="M3.5 10.7a3.5 3.5 0 0 1 .6-.4" />
    <path d="M6 17.5a3.8 3.8 0 0 1-1.9-.5" />

    <!-- AI Digital Neural Circuit Paths -->
    <path d="M12 12.5h3.5" />
    <path d="M12 17.5h4.5a2 2 0 0 1 2 2v1" />
    <path d="M12 7.5h7.2" />
    <path d="M15.5 7.5V4.8a1.8 1.8 0 0 1 1.8-1.8" />

    <!-- Neural Circuit Nodes -->
    <circle cx="15.5" cy="12.5" r="1.3" fill="#ffffff" stroke="none" />
    <circle cx="17.3" cy="3" r="1.3" fill="#ffffff" stroke="none" />
    <circle cx="18.5" cy="20.5" r="1.3" fill="#ffffff" stroke="none" />
    <circle cx="19.2" cy="7.5" r="1.3" fill="#ffffff" stroke="none" />
  </g>
</svg>