# Development specific configuration

# CORS
app.cors.allowed-origins=http://localhost:5173

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/skillmatch}

# JWT Configuration
jwt.secret=${JWT_SECRET:your-super-secret-key-that-is-at-least-256-bits-long-for-dev-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:your_gemini_api_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent